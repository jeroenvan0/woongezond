# /etc/nginx/conf.d/woongezond-rate-limiting.conf — geladen in de http{} context.
#
# Eigen zone voor de Next-app. Tot 2026-09-14 hing /admin/api/ aan zone `supabase_api`
# (60 r/min per IP), dezelfde zone als de Supabase-proxy op supabase.vostech.group. Alles
# wat de browser doet telde dus in één emmer: auth-refresh, apparaatlijst, realtime, én
# de dashboard-calls (per sensorwissel ~8 requests: 5 vensters /api/data, weer, weerhistorie,
# meldingen). Drie keer van sensor wisselen = 429 voor de bewoner. De dure routes hebben
# al een limiet per gebruiker in de app (lib/rateLimit.ts); dit is alleen anti-misbruik.
#
# 300 r/min = 5/s, burst 60: een dashboard-sessie haalt dat niet, een script wel.
limit_req_zone $binary_remote_addr zone=woongezond_api:10m rate=300r/m;
